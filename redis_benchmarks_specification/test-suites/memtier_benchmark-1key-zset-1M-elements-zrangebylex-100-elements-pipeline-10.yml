version: 0.4
name: memtier_benchmark-1key-zset-1M-elements-zrangebylex-100-elements-pipeline-10
description: 'Runs memtier_benchmark, for a keyspace length of 1 SORTED SET key. The SORTED SET contains
  exactly 1,000,000 elements (integer members 1..1,000,000, constant score of 1 -- reuses the 1key-zset-1M-elements-const-score
  dataset whose single-__key__ preload has no #508 shortfall) and we query a 100-element lexicographical
  slice using ZRANGEBYLEX - + LIMIT 0 100, pipelined 10-deep. LIMIT makes the slice exact (verified live:
  exactly 100 elements returned): each call seeks to the lex minimum (the "-" sentinel resolves to the
  leftmost skiplist node) and iterates 100 sdscmplen comparisons forward, so it measures large-set lex
  seek+iteration cost without materialising a huge reply -- the by-lex counterpart of the 1M by-score
  specs, which either scan a 100-element listpack (all-elements) or seek by random score position (random-position).
  With a constant score the (score,member) order is purely lexicographical, which is the regime ZRANGEBYLEX
  is defined for. Encoding: skiplist+hashtable (1,000,000 elements, exceeds zset-max-listpack-entries
  128). Metric of interest: Ops/sec.'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --pipeline 50 --command="ZADD lb 1 __key__" --command-key-pattern=P --key-minimum 1 --key-maximum
      1000000 --key-prefix "" -n 100000 --hide-histogram -t 10 -c 1
  resources:
    requests:
      memory: 1g
  dataset_name: 1key-zset-1M-elements-const-score
  dataset_description: This dataset contains 1 sorted set key with 1,000,000 elements (integer members
    1..1,000,000, verified via live ZCARD), each with a constant score of 1.
tested-groups:
- sorted-set
tested-commands:
- zrangebylex
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command="ZRANGEBYLEX lb - + LIMIT 0 100" --hide-histogram --test-time 120 --pipeline 10
    -c 1 -t 1
  resources:
    requests:
      cpus: '4'
      memory: 2g
priority: 8
